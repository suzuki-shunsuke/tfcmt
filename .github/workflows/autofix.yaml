---
name: autofix.ci
on: pull_request
permissions: {}
jobs:
  # Don't add jobs to this file. Please add jobs to wc_autofix.yaml.
  fix:
    uses: ./.github/workflows/wc_autofix.yaml
    permissions:
      contents: read
      id-token: write
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
  autofix:
    runs-on: ubuntu-26.04
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    timeout-minutes: 10
    permissions: {}
    needs:
      - fix
    steps:
      - run: exit 1
  # Don't add jobs to this file. Please add jobs to wc_autofix.yaml.
