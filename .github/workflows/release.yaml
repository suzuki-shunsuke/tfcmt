---
name: Release
on:
  push:
    tags: [v*]
jobs:
  release:
    uses: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml@65cf3a51c7c83344e9c7a78a374467bd71ee8544 # v9.0.1
    with:
      go-version-file: go.mod
      aqua_version: v2.63.0
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    permissions:
      contents: write
      id-token: write
      actions: read
      attestations: write
